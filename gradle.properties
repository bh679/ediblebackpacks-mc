mod_description=Eat a backpack to permanently grow your personal backpack storage by one slot. Storage appears as two panels flanking the inventory screen (up to 108 slots). Backpacks are non-stackable and compact 3x3 into an Upgraded Backpack worth 9 slots. Persists through death by default; host mods/servers can enable reset-on-death.
